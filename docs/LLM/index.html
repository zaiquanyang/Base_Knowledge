<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM 笔记索引</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #d7deea;
      --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 20px 64px;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 32px;
    }
    p {
      color: var(--muted);
      margin-bottom: 24px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    li:last-child { border-bottom: 0; }
    span {
      color: var(--muted);
      white-space: nowrap;
    }
    a { color: var(--accent); text-decoration: none; }
    .back-link {
      display: inline-block;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <main>
    <a class="back-link" href="../index.html">返回首页</a>
    <h1>LLM 笔记索引</h1>
    <p>这里收录 LLM 目录下已经生成的 HTML 页面。</p>
    <section class="panel">
      <ul>
        <li><a href="./GRPO/summary_GRPO.html">GRPO</a><span>GRPO</span></li>
        <li><a href="./Post_Training/summary_Post_Training.html">Post_Training</a><span>Post_Training</span></li>
        <li><a href="./test_math.html">test_math</a><span></span></li>
      </ul>
    </section>
  </main>
</body>
</html>
